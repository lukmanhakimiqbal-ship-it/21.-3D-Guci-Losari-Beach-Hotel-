<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model 3D</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    model-viewer { width: 100%; height: 90vh; background: #eee; }
    p { text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <model-viewer
    src="21. Guci.glb"
    alt="21 .Guci Losari Beach Hotel"
    orientation="-90deg 0deg 0deg"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    loading="eager">
  </model-viewer>
  <p>Model 3D: 21. Guci Losari Beach Hotel | Lisensi: CC BY 4.0</p>
</body>
</html>
